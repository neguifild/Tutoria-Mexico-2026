<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>TutorIA · Escola México</title>
<meta name="description" content="Plataforma de tutoria com inteligência artificial para a Escola México.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ... [SEU CSS ORIGINAL MANTIDO INTACTO] ... */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --verde:#1a6b2a;--verde2:#2d8a40;--verde3:#4aad5a;--verde4:#d4edd8;
  --vermelho:#c0131a;--branco:#f8faf8;
  --ouro:#b8862a;--ouro2:#d4a840;
  --ink:#070f09;--ink2:#0e1a10;--ink3:#162018;
  --s1:#1c2e1e;--s2:#243428;--border:#2a3e2c;
  --text:#ddeade;--muted:#7a9a7c;--dim:#3a5040;
  --ok:#2eb87a;--rk:#d95f5f;--at:#d98b3a;--az:#4a90d9;--pu:#8b6fd9;
  --r:14px;--r2:10px;--r3:8px;
  --sh:0 4px 24px rgba(0,0,0,.4);
  --sh2:0 2px 12px rgba(0,0,0,.3);
}
html{scroll-behavior:smooth;background:var(--ink)}
body{font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);min-height:100vh;background:var(--ink);overflow-x:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--ink)}
::-webkit-scrollbar-thumb{background:var(--s1);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--s2)}

/* ═══ SCREENS ═══ */
.screen{display:none;min-height:100vh}
.screen.on{display:flex;flex-direction:column}

/* ══ LOGIN ══ */
#sLogin{
  align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 30% 20%, rgba(26,107,42,.22) 0%, transparent 60%),
             radial-gradient(ellipse at 70% 80%, rgba(192,19,26,.1) 0%, transparent 50%),
             var(--ink);
  padding:20px;
}
.login-card{
  width:100%;max-width:420px;
  background:rgba(14,26,16,.85);
  border:1px solid var(--s2);
  border-radius:20px;
  padding:40px 36px;
  backdrop-filter:blur(20px);
  box-shadow:0 24px 64px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04);
}
.login-logo-img{
  width:72px;height:72px;border-radius:50%;object-fit:cover;
  border:2px solid var(--verde2);
  display:block;margin:0 auto 20px;
  box-shadow:0 0 30px rgba(45,138,64,.35);
}
.login-title{
  font-family:'Playfair Display',serif;
  font-size:36px;font-weight:700;font-style:italic;
  color:var(--verde3);text-align:center;letter-spacing:-.5px;
  margin-bottom:4px;
}
.login-subtitle{
  text-align:center;font-size:11px;color:var(--muted);
  letter-spacing:2.5px;text-transform:uppercase;margin-bottom:32px;
  font-family:'DM Mono',monospace;
}
.login-tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:24px}
.ltab{
  padding:10px 6px;border-radius:8px;border:1px solid var(--s1);
  background:var(--ink2);color:var(--muted);font-size:11px;font-weight:500;
  cursor:pointer;text-align:center;transition:all .2s;letter-spacing:.3px;
}
.ltab:hover{border-color:var(--verde);color:var(--text)}
.ltab.on{background:var(--verde);border-color:var(--verde2);color:#fff;font-weight:600}
.login-label{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;font-family:'DM Mono',monospace; transition: all 0.2s;}
.login-input{
  width:100%;background:var(--ink);border:1px solid var(--s2);
  color:var(--text);padding:13px 16px;border-radius:9px;
  font-family:'DM Sans',sans-serif;font-size:15px;outline:none;
  transition:border-color .2s,box-shadow .2s;margin-bottom:14px;
  letter-spacing:2px;text-align:center;
}
.login-input:focus{border-color:var(--verde2);box-shadow:0 0 0 3px rgba(45,138,64,.15)}
.login-btn{
  width:100%;background:var(--verde);border:none;color:#fff;
  padding:14px;border-radius:9px;font-family:'DM Sans',sans-serif;
  font-size:14px;font-weight:600;cursor:pointer;
  letter-spacing:.5px;text-transform:uppercase;transition:all .2s;
  box-shadow:0 4px 16px rgba(26,107,42,.4);
}
.login-btn:hover{background:var(--verde2);transform:translateY(-1px);box-shadow:0 6px 20px rgba(26,107,42,.5)}
.login-btn:active{transform:translateY(0)}
.login-err{color:var(--rk);font-size:12px;text-align:center;margin-top:10px;min-height:16px}
</style>
</head>

    <h1 class="login-title">TutorIA</h1>
    <p class="login-subtitle">Escola México</p>
    
    <div class="login-tabs">
      <button class="ltab on" onclick="switchTab(this, 'tutor')">Tutor</button>
      <button class="ltab" onclick="switchTab(this, 'estudante')">Estudante</button>
      <button class="ltab" onclick="switchTab(this, 'direcao')">Direção</button>
    </div>

    <form id="loginForm" onsubmit="realizarLogin(event)">
      <input type="hidden" id="userRole" name="role" value="tutor">

      <div class="login-label" id="loginLabel">Código do Tutor</div>
      <input type="password" id="loginInput" class="login-input" placeholder="••••••••" required>
      <button type="submit" class="login-btn">Entrar</button>
    </form>
  </section>
</main>

<script>
  // Função que faz a mágica de trocar o formulário
  function switchTab(clickedElement, role) {
    // 1. Remove a classe "on" de todas as abas
    const tabs = document.querySelectorAll('.ltab');
    tabs.forEach(tab => tab.classList.remove('on'));
    
    // 2. Adiciona a classe "on" apenas na aba clicada
    clickedElement.classList.add('on');
    
    // 3. Pega as referências dos elementos que vão mudar
    const label = document.getElementById('loginLabel');
    const input = document.getElementById('loginInput');
    const roleInput = document.getElementById('userRole');

    // 4. Salva a nova role (perfil) no formulário
    roleInput.value = role;

    // 5. Altera o visual do formulário dependendo do botão clicado
    if (role === 'tutor') {
      label.innerText = 'Código do Tutor';
      input.placeholder = 'Digite o código do tutor';
      input.type = 'password';
    } 
    else if (role === 'estudante') {
      label.innerText = 'Matrícula do Estudante';
      input.placeholder = 'Digite sua matrícula';
      input.type = 'text'; // Estudante geralmente usa texto ao invés de senha oculta, mude se precisar
    } 
    else if (role === 'direcao') {
      label.innerText = 'Chave do Vice-Diretor';
      input.placeholder = 'Chave de acesso da direção';
      input.type = 'password';
    }

    // Limpa o input sempre que trocar de aba para evitar erros
    input.value = '';
  }

  // Função simulando o envio
  function realizarLogin(event) {
    event.preventDefault(); // Impede a página de recarregar
    
    const perfilSelecionado = document.getElementById('userRole').value;
    const credencial = document.getElementById('loginInput').value;

    alert(`Tentando fazer login como: ${perfilSelecionado.toUpperCase()}\nCredencial digitada: ${credencial}`);
    
    // Aqui no futuro você colocaria o código para enviar os dados pro seu servidor do GitHub Pages/Backend!
  }
</script>
</body>
